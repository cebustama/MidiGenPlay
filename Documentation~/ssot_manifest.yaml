      - "Runtime/CoreScripts/Data/ChordProgressionsList.cs"
      - "Runtime/CoreScripts/Composition/RomanProgressionParser.cs"
      - "Runtime/CoreScripts/Composition/ChordQualityResolver.cs"
    invariants:
