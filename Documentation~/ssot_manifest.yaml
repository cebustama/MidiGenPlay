    invariants:
      - "Melody generation splits into phrase planning (PhrasePlanner) and note choice/rendering (MelodyTrackComposer + strategies)."
      - "An authored MelodyPatternData on TrackParameters.Pattern overrides the procedural pipeline via MelodyTrackComposer.ComposeFromPattern (dispatched before progression resolution; the Style/MelodyCardConfigSO procedural overrides are skipped on this path). degree+octaveOffset resolve to an absolute pitch against the active Part tonality/root from the instrument's mid octave (ChooseMelodicRegister convention), clamped to the instrument range; beats are mapped through MelodyTrackComposer.BeatsToSpan onto the PART's beat unit (GetBeatSpan(part.TimeSignature) — quarter in 4/4, eighth in 6/8), the same single seam ComposeMelodyFromProgression uses (MEL-BEATUNIT-1; byte-identical in beatUnit == 4 meters, a deliberate sync fix elsewhere); the authored loop is tiled to the Part with final-loop truncation; no RNG (deterministic); guide notes are cached via ctx.SetMelodyForPartMusician. The chord progression is not consulted on this path."
      - "Melody card-pattern precedence (D-MEL-INT1): MelodyCardConfigSO.patternOverride (read off TrackParameters.Style) wins over TrackParameters.Pattern, which wins over the procedural pipeline — mirroring RhythmCardConfigSO.patternOverride. The card override feeds the same RNG-free ComposeFromPattern path; the card's leading/palette/style fields stay procedural-only and apply only when no pattern is selected."
      - "MEL-NULL-1: PhrasePlanner.PlanPhraseSlotsForSpan never returns null — it returns an empty slot list when it cannot plan. A USABLE phrase palette (defined once by PhrasePlanner.HasUsablePalette: leading config present + PhrasePaletteSO present + at least one archetype entry) is a hard precondition of the procedural melody pipeline; the planner's bail and MelodyTrackComposer's up-front check gate on that single predicate and must not re-derive it. On failure MelodyTrackComposer.ComposeMelodyFromProgression logs one error and returns an EMPTY melody track so the rest of the song still renders. Palette resolution: card phrasePaletteOverride > card leadingOverride.phrasePalette > MidiGenPlayConfig.melodicLeading.phrasePalette; an authored MelodyPatternData takes the ComposeFromPattern path and needs no palette."
      - "Phrase-vocabulary enumeration (Ask B, E-2=A): PhrasePaletteSO/PhraseArchetypeSO enumerate via TrackPatternConfigStoreResources<T>(Phrases) over canonical Patterns/Phrases (recursive, type-filtered; PhraseArchetypeSO abstract -> concrete assets load under it). Documented contract only; IPatternRepository not extended. MGP-ALWTTT-DBG-2."

