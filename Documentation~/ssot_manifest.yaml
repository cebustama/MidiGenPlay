      - "Runtime/CoreScripts/UI/PatternGridCell.cs"
      - "Runtime/CoreScripts/UI/RhythmRowHeader.cs"
    invariants:
      - "StepState { bool active; int velocity; } is the canonical persisted step model."
      - "velocity == 0 is the sentinel meaning defer to lane defaultVelocity."
      - "StepState.ResolveVelocity(int laneDefault) encapsulates effective velocity resolution."
      - "Authoring tools produce data; they do not own runtime semantics."
      - "SnapshotAsIndices() return signature is unchanged — existing runtime callers unaffected."
      - "DrumPatternCatalogueWizard is a read-only catalogue/browser: discover → filter → inspect → select; it never mutates assets and never duplicates the editor's apply/save pipeline (L5, L-PAL)."

  - path: Documentation~/authoring/SSoT_Authoring_LLM_Generation.md
    authority_class: subsystem_ssot
    governs:
      - "Runtime/CoreScripts/Composition/Data/RhythmGenreVocabularySO.cs"
      - "Editor/DrumPatternLLMPromptBuilder.cs"
      - "Editor/DrumPatternLLMGenerator.cs"
      - "Editor/DrumPatternLLMResponseHandler.cs"
      - "Editor/DrumPatternEditorImporter.cs"
      - "Editor/LaneAliasDictionary.cs"
      # Chord adopter (Batch L4, closed 2026-05-29)
      - "Runtime/CoreScripts/Composition/Data/ChordGenreVocabularySO.cs"
      - "Editor/ChordProgressionLLMPromptBuilder.cs"
      - "Editor/ChordProgressionLLMGenerator.cs"
      - "Editor/ChordProgressionLLMResponseHandler.cs"
      - "Editor/ChordProgressionEditorImporter.cs"
      - "Editor/ChordLLMFieldPlan.cs"
      - "Editor/ChordGenreVocabularyBuilder.cs"
    invariants:
      - "The asset is the seam: the LLM produces an authoring asset; runtime consumes the asset. No LLM call sits on a render/compose path."
      - "LLM authoring output is non-deterministic; the runtime determinism invariant is preserved by construction via the asset boundary."
      - "Async LLM calls never block the UI thread (no .Result/.Wait()/.GetAwaiter().GetResult() on the main thread)."
      - "No silent fallback on unknown tokens: unknown aliases/glyphs warn with location info; the system never substitutes a default."
      - "Parser-degrades adopters enforce no-silent-fallback in the response handler: where a domain parser warns-and-downgrades an unknown token instead of failing (RomanProgressionParser), an allowlist guard in the handler treats off-alphabet tokens as a hard failure (chord adopter, D-L4.5)."
      - "Line splitting is CRLF-safe; \\r\\n is treated as a single separator."
      - "Cost cap is enforced pre-network in the prompt builder; an over-budget prompt is refused without spending."
      - "LLM/imported output is committed to the tool working copy only; the asset mutates solely via the tool's explicit Apply/Save."
      - "Consumer-side adopters are governed by this SSoT's pattern (§7) but their artifacts are out-of-tree and never appear in governs: (third adopter: ALWTTT Card Editor, CE-L1, closed 2026-06-11)."
      - "Asset-referencing adopters ban LLM-emitted asset references outright: path/guid-shaped values are a hard failure in the response handler; asset intent travels only through typed intent fields resolved deterministically editor-side (card adopter: palette intent via the shared PaletteSelector, seeded; modifier effects by exact-name all-or-nothing staging resolution)."

  - path: Documentation~/authoring/SSoT_Authoring_Melody_Composition.md
    authority_class: subsystem_ssot
    governs:
      - "Runtime/CoreScripts/Data/MelodyPatternData.cs"
      - "Runtime/CoreScripts/Composition/Data/MelodyGenerationParamsSO.cs"
      - "Editor/MelodyPatternEditorWindow.cs"        # Phase 2 ladder grid + Phase 3 generation-params section (§5)
      - "Editor/SimplifiedMelodyGenerator.cs"        # Phase 3 editor-only deterministic generator (§5)
    # Phase 1 of Roadmap_Melody_Authoring_MVP (closed 2026-06-16) populated the two runtime
    # types above: the deterministic MelodyPatternData per-note model + the
    # MelodyGenerationParamsSO bundle. Phase 2 (closed 2026-06-16) added the ladder note-grid
    # editor and Phase 3 (closed 2026-06-17) added the generation-params section + the
    # editor-only SimplifiedMelodyGenerator — both documented in §5 and now governed here.
    # Phrase palettes / MelodicLeadingConfig / MelodicStyleSO remain governed on the runtime
    # side by runtime/SSoT_Composer_Melody_Track.md. MelodyPatternsList.cs is a shape-agnostic
    # catalogue (unchanged). The ComposeFromPattern runtime-override path landed in Phase 4 (closed 2026-06-17) and is governed by runtime/SSoT_Composer_Melody_Track.md §7; the Melody Authoring MVP is complete (Phase 5 closed 2026-06-22).
    invariants:
      - "MelodyPatternData is a deterministic per-note model: each note is one ScaleDegree + octave offset + beat-relative start/duration + velocity. Absolute MIDI pitch is NOT stored; degree->pitch resolves at runtime against the active tonality/root (identical playback for the same pattern + key). The legacy probabilistic possibleDegrees model and its sole consumer MidiGenerator.GenerateMelodyTrackWithPattern were removed (Phase 1, decision M-3)."
      - "MelodyGenerationParamsSO is a generation-time aid for the authoring wizard's simplified generator (Tier-1 params + optional procedural-asset references); it is never read at runtime. instrumentHint and tonalityHint are carried but do not affect generated notes in the MVP (the pattern stores neither instrument nor pitch)."
      - "SimplifiedMelodyGenerator is editor-only (Editor/, MidiGenPlay.Authoring) and deterministic: pitch/octave are drawn from System.Random(seed) while onset placement is a pure function of style + density + meter (RNG-free), so the same seed + params + meter reproduce the same note list. It writes the wizard's working copy only and does not invoke the procedural pipeline (Phase D3)."

