# PATH CONVENTION
# All paths are relative to the package root (MidiGenPlay/).
# Documentation lives under Documentation~/ (Unity tilde convention).
# Runtime source: Runtime/CoreScripts/
# Editor source:  Editor/
#
# SCHEMA NOTE
# This manifest uses two extensions beyond the base skill schema:
#   reference:  cross-project docs; audited for Step 3 misuse only (no governs)
#   research:   exploratory docs; audited for Step 3 misuse only (no governs)

authority_order:
  - subsystem_ssot
  - contracts
  - coverage_matrix
  - current_state
  - roadmap
  - reference
  - research
  - archive

ssots:

  - path: Documentation~/SSoT_INDEX.md
    authority_class: subsystem_ssot
    governs:
      - "Documentation~/**/*.md"
    invariants:
      - "Authority order: runtime/ > authoring/ > SSoT_CONTRACTS > coverage-matrix > CURRENT_STATE > reference > planning > research > archive."
      - "Cross-project docs under reference/ do not define MidiGenPlay package truth."
      - "Roadmaps, research prompts, and archive docs may not silently become authoritative."

  - path: Documentation~/SSoT_CONTRACTS.md
    authority_class: contracts
    governs:
      - "Runtime/CoreScripts/**/*.cs"
      - "Editor/**/*.cs"
      - "Documentation~/**/*.md"
    invariants:
      - "MidiGenPlay is a Unity package; runtime code must not depend on editor-only APIs."
      - "Part time signature is authoritative for meter normalization and rendering."
      - "No silent promotion: roadmaps, research, cross-project docs, and archive may not become authoritative without an explicit change in coverage-matrix.md and changelog-ssot.md."
      - "A technical change is not complete until primary SSoT, CURRENT_STATE, changelog-ssot, and coverage-matrix are all updated."
      - "Runtime code must clone progression assets before use; project assets must never be mutated in place."
      - "Same inputs + same seed => same outputs. All composers must be deterministic."

  - path: Documentation~/coverage-matrix.md
    authority_class: coverage_matrix
    governs:
      - "Documentation~/**/*.md"
    invariants:
      - "Every concept listed has exactly one primary authority; secondary docs may link but not redefine."

  - path: Documentation~/CURRENT_STATE.md
    authority_class: current_state
    governs: []

  - path: Documentation~/runtime/SSoT_Runtime_Song_Model_and_Config.md
    authority_class: subsystem_ssot
    governs:
      - "Runtime/CoreScripts/Data/SongConfig.cs"
      - "Runtime/CoreScripts/Data/SongConfigSO.cs"
      - "Runtime/CoreScripts/Data/MidiGenPlayConfig.cs"
      - "Runtime/CoreScripts/Managers/SongConfigManager.cs"
    invariants:
      - "SongConfig is the runtime song model authority."
      - "Parts own meter, tonality, root, and track lists."
      - "TrackParameters is the package-owned cross-role input surface."
      - "TrackParameters fields of documentary importance: Pattern, RhythmRecipe, BackingRecipe, Style."

  - path: Documentation~/runtime/SSoT_Runtime_Generation_Orchestration.md
    authority_class: subsystem_ssot
    governs:
      - "Runtime/CoreScripts/Composition/MidiGenerator.cs"
      - "Runtime/CoreScripts/Composition/SongOrchestrator.cs"
      - "Runtime/CoreScripts/Composition/Factories/ComposerFactories.cs"
      - "Runtime/CoreScripts/Composition/Interfaces/ITrackComposer.cs"
    invariants:
      - "MidiGenerator registers composer factories by TrackRole; it is the package-facing entry point, not the per-track implementation surface."
      - "MGP-MIX-1: mixGains per-entry emission gate — no entry ⇒ bit-identical render (contract in SSoT_CONTRACTS.md §8, mechanism in §5.4). Rhythm excluded in v1 (shared ch9). Consumer gain is per-render data, never a SongConfig field."
      - "SongOrchestrator walks song structure and executes per-track ITrackComposer instances."
      - "Same inputs + same seed => same outputs. Composers must be deterministic."
      - "Caller-supplied seedOverride (GenerateSong / GenerateSinglePart) is the sole per-render entropy input; baseSeed = seedOverride ?? defaultSeed is resolved once per render and all part/rep/track seeds derive from it (incl. the PaletteSelector RNG stream). No seed supplied => bit-identical to defaultSeed behavior. Seed policy is host-side; the package never self-generates per-render entropy. MGP-ALWTTT-SEED-1. GenContext.trackSeed exposes the per-track seed (swap/restored by GenerateOne like ctx.rng); ResolveArticulationSeed(trackSeed) is a named derivation seam; both derive from baseSeed — no new entropy site. MGP-ALWTTT-ARTIC-1. Per-part tempo resolves bpmOverride ?? PartConfig.ExplicitBpm ?? seeded-roll (ExplicitBpm live on both entries); the roll picks from MusicTheory.GetValidBpms via System.Random(ResolveTempoSeed(baseSeed, partIndex)) — a dedicated per-part-occurrence substream (StableHash32 over baseSeed|p=partIndex|tempo, no rep) that never perturbs ctx.rng. GetBPMFromRange stays unseeded/off-render-path; bpmOverride/ExplicitBpm-hit paths bit-identical. BPM-DET-1."
      - "Per-track PartRender surfaces (stems/melInst/percInst/resolvedByTrack) and GenerateSinglePart instrumentOverrides/patternOverrides are keyed on MusicianTrackKey (musicianId, TrackRole); the track tag is mus:{id}:{role}. GenContext.ReportResolved (Ask A) and GenContext.patternOverride (Ask C, precedence step 0; clone-on-apply; type-mismatch warn+ignore; Bassline warn+ignore) are swap/restored by GenerateOne exactly like ctx.rng/trackSeed. Readback source identity is by pre-clone asset name (no runtime GUID). Harmony not reported in v1. No override + no seed => bit-identical. MGP-ALWTTT-DBG-1+3."

