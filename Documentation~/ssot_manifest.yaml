  - path: Documentation~/SSoT_INDEX.md
    authority_class: subsystem_ssot
    governs:
      - "Documentation~/**/*.md"
    invariants:
      - "Authority order: runtime/ > authoring/ > SSoT_CONTRACTS > coverage-matrix > CURRENT_STATE > reference > planning > research > archive."
      - "Cross-project docs under reference/ do not define MidiGenPlay package truth."
      - "Roadmaps, research prompts, and archive docs may not silently become authoritative."

  - path: Documentation~/SSoT_CONTRACTS.md
    authority_class: contracts
    governs:
      - "Runtime/CoreScripts/**/*.cs"
      - "Editor/**/*.cs"
      - "Documentation~/**/*.md"
    invariants:
      - "MidiGenPlay is a Unity package; runtime code must not depend on editor-only APIs."
      - "Part time signature is authoritative for meter normalization and rendering."
      - "No silent promotion: roadmaps, research, cross-project docs, and archive may not become authoritative without an explicit change in coverage-matrix.md and changelog-ssot.md."
      - "A technical change is not complete until primary SSoT, CURRENT_STATE, changelog-ssot, and coverage-matrix are all updated."
      - "Runtime code must clone progression assets before use; project assets must never be mutated in place."
      - "Same inputs + same seed => same outputs. All composers must be deterministic."

  - path: Documentation~/coverage-matrix.md
    authority_class: coverage_matrix
    governs:
      - "Documentation~/**/*.md"
    invariants:
      - "Every concept listed has exactly one primary authority; secondary docs may link but not redefine."

  - path: Documentation~/CURRENT_STATE.md
    authority_class: current_state
    governs: []

  - path: Documentation~/runtime/SSoT_Runtime_Song_Model_and_Config.md
    authority_class: subsystem_ssot
    governs:
      - "Runtime/CoreScripts/Data/SongConfig.cs"
      - "Runtime/CoreScripts/Data/SongConfigSO.cs"
      - "Runtime/CoreScripts/Data/MidiGenPlayConfig.cs"
      - "Runtime/CoreScripts/Managers/SongConfigManager.cs"
    invariants:
      - "SongConfig is the runtime song model authority."
      - "Parts own meter, tonality, root, and track lists."
      - "TrackParameters is the package-owned cross-role input surface."
      - "TrackParameters fields of documentary importance: Pattern, RhythmRecipe, BackingRecipe, Style."

  - path: Documentation~/runtime/SSoT_Runtime_Generation_Orchestration.md
    authority_class: subsystem_ssot
    governs:
      - "Runtime/CoreScripts/Composition/MidiGenerator.cs"
      - "Runtime/CoreScripts/Composition/SongOrchestrator.cs"
      - "Runtime/CoreScripts/Composition/Factories/ComposerFactories.cs"
      - "Runtime/CoreScripts/Composition/Interfaces/ITrackComposer.cs"
    invariants:
      - "MidiGenerator registers composer factories by TrackRole; it is the package-facing entry point, not the per-track implementation surface."
      - "MGP-MIX-1: mixGains per-entry emission gate — no entry ⇒ bit-identical render (contract in SSoT_CONTRACTS.md §8, mechanism in §5.4). Rhythm excluded in v1 (shared ch9). Consumer gain is per-render data, never a SongConfig field."
      - "SongOrchestrator walks song structure and executes per-track ITrackComposer instances."
      - "Same inputs + same seed => same outputs. Composers must be deterministic."
      - "Caller-supplied seedOverride (GenerateSong / GenerateSinglePart) is the sole per-render entropy input; baseSeed = seedOverride ?? defaultSeed is resolved once per render and all part/rep/track seeds derive from it (incl. the PaletteSelector RNG stream). No seed supplied => bit-identical to defaultSeed behavior. Seed policy is host-side; the package never self-generates per-render entropy. MGP-ALWTTT-SEED-1. GenContext.trackSeed exposes the per-track seed (swap/restored by GenerateOne like ctx.rng); ResolveArticulationSeed(trackSeed) is a named derivation seam; both derive from baseSeed — no new entropy site. MGP-ALWTTT-ARTIC-1. Per-part tempo resolves bpmOverride ?? PartConfig.ExplicitBpm ?? seeded-roll (ExplicitBpm live on both entries); the roll picks from MusicTheory.GetValidBpms via System.Random(ResolveTempoSeed(baseSeed, partIndex)) — a dedicated per-part-occurrence substream (StableHash32 over baseSeed|p=partIndex|tempo, no rep) that never perturbs ctx.rng. GetBPMFromRange stays unseeded/off-render-path; bpmOverride/ExplicitBpm-hit paths bit-identical. BPM-DET-1. ResolveWalkSeed (FNV-1a over \"{trackSeed}|walk\", B3 WALK-2) completes the family and is DIFFERENT IN KIND from the roller seeds: it never feeds a stateful System.Random. The bass consumes it as the KEY OF A PURE PER-(event, hit) INTEGER MIX (the VelocityJitter idiom, D-V1-JIT-SRC=A applied to pitch instead of velocity), so no draw order exists downstream of it and no toggle, branch or event length can shift anything derived from it. That is precisely why the always-roll draw discipline that governs the roller substreams does NOT apply here — the property is structural, not maintained."
      - "Rhythm onset channel (MGP-ALWTTT-BASS-POCKET-1, D-PKT-SRC=B, §5): GenContext carries a per-part publish/consume cache (SetRhythmOnsetsForPartMusician / GetRhythmOnsetsForPart), same mould as the progression and melody caches and wired identically in BOTH entry points. List-backed per part, so 'first publisher wins' is publication (track-list) order BY CONSTRUCTION; empty/null publications are ignored and are indistinguishable from not publishing. This is the package's FIRST composer→composer data dependency (Rhythm publishes on the grid path only, Bass consumes): it is order-sensitive by design (D-PKT-ORDER=A — Rhythm must precede Bassline in Part.Tracks) and the CONSUMER owns the degrade path, which is pinned as BYTE-identity, not approximate. The factories CreateSetRhythmOnsetsForPartMusician / CreateGetRhythmOnsetsForPart are public static test seams."
      - "Host-supplied default progression (MGP-ALWTTT-BASS-SOLO-1, §5.5): GenerateSinglePart takes a trailing optional ChordProgressionData defaultProgression, pre-seeded into the per-render progressionByPart cache BEFORE the track loop, so a part with a Bassline (or Melody/Harmony) row and NO Backing row has a harmony source (D-SOLO-SRC=A host-supplied, D-SOLO-SURF=A2 orchestrator parameter). Warn + IGNORE when the part HAS a Backing track (D-SOLO-GUARD=A) — the Backing track owns the shared harmony and seeding under it would fork the render, since the card-palette publish is guarded by don't-overwrite; the supported alternative is patternOverride on Backing (precedence step 0). Seeded AS-IS (D-SOLO-NORM=A: no TS normalization on this path — a THIRD instance of the normalization-order hazard; hosts author in the part TS) and as a NAME-PRESERVING runtime clone, so no runtime state aliases the asset and the Ask-A readback stays meaningful. RUNTIME-REQUALITY is applied at this site too, and when it clones, that clone IS the seeded instance (single clone, never two). D-SOLO-DET: pure dictionary write, ZERO ctx.rng draws; a null default seeds nothing and is byte-identical. Seam: public static SongOrchestrator.TrySeedDefaultProgression → DefaultProgressionSeedResult { NotSupplied, Seeded, IgnoredBackingPresent }. GenerateSong does NOT take the parameter in v1."
      - "Test-seam visibility convention (F-IVT-STALE, resolved at B0, §5.6): named seams that exist for EditMode tests are declared PUBLIC STATIC, not internal. Runtime/AssemblyInfo.cs still carries [assembly: InternalsVisibleTo(\"MidiGenPlay.Tests.Editor\")], but the directive is INERT — no test in the package exercises internal access, and the members its comment cited as 'internal seams' (ChordTrackComposer.TryDirectionalFirstChordCore, SongOrchestrator.ResolveTrackSeedPart) are public, as are BassTrackComposer.ResolveArticulation, SongOrchestrator.TrySeedDefaultProgression, DefaultProgressionSeedResult, ChordProgressionRequality.TryMapCoreQuality and the onset-channel factories. It is retained only as an escape hatch. A batch that wants the internal discipline back must FIRST confirm the real test .asmdef name and re-run the suite. Doc sites describing any of these as 'internal' were corrected at B0."
      - "Per-track PartRender surfaces (stems/melInst/percInst/resolvedByTrack) and GenerateSinglePart instrumentOverrides/patternOverrides are keyed on MusicianTrackKey (musicianId, TrackRole); the track tag is mus:{id}:{role}. GenContext.ReportResolved (Ask A) and GenContext.patternOverride (Ask C, precedence step 0; clone-on-apply; type-mismatch warn+ignore; Bassline warn+ignore) are swap/restored by GenerateOne exactly like ctx.rng/trackSeed. Readback source identity is by pre-clone asset name (no runtime GUID). Harmony not reported in v1. No override + no seed => bit-identical. MGP-ALWTTT-DBG-1+3."

  - path: Documentation~/runtime/SSoT_Composer_Backing_Track.md
    authority_class: subsystem_ssot
    governs:
      - "Runtime/CoreScripts/Composition/Composers/ChordTrackComposer.cs"
      - "Runtime/CoreScripts/Composition/Data/BackingCardConfigSO.cs"
      - "Runtime/CoreScripts/Composition/Data/ChordProgressionPaletteSO.cs"
      - "Runtime/CoreScripts/Composition/Styles/BackingStyles.cs"
      - "Runtime/CoreScripts/Composition/Data/PaletteSelection.cs"   # CE-F1 shared selector (ProgressionFinder + PaletteSelector); also under SSoT_Composer_Rhythm_Track. Chord selection contract in §2.
      - "Runtime/CoreScripts/Composition/Strategies/VoiceLeading.cs"   # CQ-A1-OBJ2 — §7 documents the inversion-pin contract enforced in GeneratePcCandidates; previously ungoverned. PATH CONFIRMED against the package tree 2026-07-29 (Composition/Strategies/VoiceLeading.cs); the inferred flag is cleared.
      - "Runtime/CoreScripts/Composition/Interfaces/IChordVoicer.cs"   # CQ-A1-OBJ2 — VoiceChord carries the optional forcedInversion pin parameter (§7.3). VL-DET-1 — also carries the optional trailing System.Random rng for seeded start-register modes (§7.4). PATH corrected at CA-T2 (was Runtime/CoreScripts/Interfaces/; confirmed under Composition/Interfaces/ against the package tree).
      - "Runtime/CoreScripts/Composition/Data/ModulationOctaveHint.cs"   # PRE-EXISTING OMISSION registered 2026-07-28 — §6 (Directional modulation hint) has documented this one-shot PartConfig transient since CQ-A1; namespace MidiGenPlay.Composition. NOT an M-3 case. The consumer that SETS it (ALWTTT ModulationEffect, namespace ALWTTT.Cards) is out of tree and is never listed. PATH CORRECTED at B4 (2026-07-28): the inferred Composition/ was wrong — SSoT_Composer_Backing_Track §6.4 states Composition/Data/ explicitly, and the primary SSoT wins per SSoT_INDEX authority order. NO LONGER INFERRED.
      - "Runtime/CoreScripts/Composition/Data/ChordExpressionType.cs"   # CA-T1 — §8 taxonomy (ChordExpressionType + ArpeggioRate); enum values serialized, never renumber. ARTIC-1 adds Random=6 + ChordExpressionWeight.
      - "Runtime/CoreScripts/Composition/Interfaces/IChordArticulator.cs"   # CA-T1 — §8 post-voicing articulation seam; consumed monophonically by the bass composer (CA-F2).
      - "Runtime/CoreScripts/Composition/Articulation/ChordArticulator.cs"   # CA-T1 — §8; internal pure PlanHits planning seam + Emit translator. New Articulation/ folder.
      - "Runtime/CoreScripts/Composition/Articulation/RandomArticulationRoller.cs"   # MGP-ALWTTT-ARTIC-1 — §8.5 Random selection policy: composer-side roll (rerollChance gate + weighted pool), dedicated seed-derived stream. CA-V1 adds the second stream (NextRate) for the ArpeggioRate.Random sentinel.
      - "Runtime/CoreScripts/Composition/Data/VelocityJitter.cs"   # CA-V1 — §8.7 seeded velocity jitter. Value type carrying a PURE MIX over (seed, event, hit); no RNG object, which is what keeps the articulator RNG-free.
      - "Runtime/CoreScripts/Composition/Interfaces/IChordReshaper.cs"   # CA-T2 — §8.6 pre-articulation voicing-reshaping seam (D-T2-SEAM=B); runs between VoiceChord and Emit.
      - "Runtime/CoreScripts/Composition/Articulation/ChordReshaper.cs"   # CA-T2 — §8.6 default reshaper: PowerChord/Chugging power-chord reduction; deterministic, RNG-free.
      - "Runtime/CoreScripts/Composition/ChordProgressionRuntimeImporter.cs"   # MGP-ALWTTT-DBG-4 — §2.2 runtime progression construction (Ask D). DUAL-LISTED: grammar authority under SSoT_Authoring_Chord_Progressions (§4.2); this listing covers the consumption contract.
      - "Runtime/CoreScripts/Composition/ChordProgressionRequality.cs"   # RUNTIME-REQUALITY — §3 application sites (backing clone step + the SOLO-1 seed path). DUAL-LISTED: policy semantics under SSoT_Authoring_Chord_Progressions (§4.1). PATH CONFIRMED against the package tree 2026-07-29; the inferred flag is cleared.
    invariants:
      - "Part meter is authoritative for backing runtime normalization."
      - "Progression assets must be cloned for runtime use; no in-place mutation of authored assets."
      - "Game-specific card semantics do not redefine backing composer theory."
      - "Chord palette TS-aware selection is delegated to the shared PaletteSelector (Tier A exact-TS / B heuristic / C raw-weights); the prior reflection-based extraction is removed. Duplicate progression references within one palette are independent weighted slots (no de-dup); one rng.NextDouble() per pick preserves determinism."
      - "Per-chord inversion pin (PartConfig.ChordInversionHints, transient, snapshot+cleared by Compose): default-unset is bit-identical; a valid pin yields exactly one candidate rotation in GeneratePcCandidates, outranking useInversions/useDrop2 (D0=A — pinning 0 forces root position and is not unset); out-of-range values are safe no-ops, never clamped (D2b=a); sticky-per-position across pattern repeats within one render (D2a=a); the §6 directional hint wins the render's first chord (D3=A, structural in both render loops); the pin is RNG-free and only active on the voice-leading path."
      - "Chord articulation (CA-T1, §8): selection is a PERSISTENT BackingCardConfigSO field (chordExpression, default Block; NOT a §6/§7 transient — no snapshot-and-clear); Block / absent card is MIDI-byte bit-identical to the legacy MoveToTime+Chord pair (test-pinned); both chord emission sites invoke the SAME unconditional articulator call (no per-site branch); the articulator is RNG-free and never consumes ctx.rng (velocity/timing are pure functions of beat position; curve ×1.00/×0.85/×0.80, clamp 1..127, Block keeps legacy 0..127 with the CA-V1 jitter off — see §8.7); figures build on the Part beatSpan/beatsPerBar (meter authority); unfittable figures degrade to true Block (never silent, no window overshoot); articulation is post-voicing and orthogonal to §6/§7 and inversions/Drop-2."
      - "Random articulation (MGP-ALWTTT-ARTIC-1, §8.5): ChordExpressionType.Random (value 6, append-only) is a selection-policy sentinel resolved composer-side per chord event by RandomArticulationRoller; the articulator never receives Random (PlanHits degrades a leaked Random to Block, never silent) and stays RNG-free; the roll stream is new System.Random(ResolveArticulationSeed(ctx.trackSeed)), derived from the SEED-1 base seed and independent of ctx.rng (voicings unaffected by Fixed<->Random toggles); default pool = uniform over the six concrete Tier-1 members (< Random; Tier-2 members do not auto-enter); randomRerollChance in [0,1] collapses granularity (1 = per chord, 0 = per render/loop); randomFigureWeights entries define the pool (weight <= 0 excludes, duplicates sum, Random ignored, degenerate => uniform fallback + warning); draw discipline fixed (first event 1 figure draw; later events 1 gate draw + conditional figure draw)."
      - "Seeded variation (CA-V1, §8.5 rate + §8.7 jitter): the velocity jitter is a PURE FUNCTION of (seed, event index, hit index) carried by Composition/Data/VelocityJitter.cs — NOT a stream (D-V1-JIT-SRC=A), so the articulator keeps its RNG-free contract verbatim, no draw order exists inside it, and the jitter cannot be perturbed by an earlier event's figure/rate/hit count. Seed = ResolveVelocityJitterSeed(ctx.trackSeed) (FNV-1a '{trackSeed}|articvel'). It is passed as Emit/PlanHits' optional trailing parameter (the IChordVoicer forcedInversion extension route) and applied as a post-pass over the planned hits, indexed by hit position: all figures INCLUDING Block, uniform integer offset in [-n,+n], clamp 1..127; velocityJitter==0 returns the planned list BY REFERENCE (bit-identity is structural). ArpeggioRate.Random=3 (append-only) is a rate sentinel resolved composer-side by RandomArticulationRoller.NextRate() on a SEPARATE substream ResolveArticulationRateSeed ('{trackSeed}|articrate'), so toggling it cannot shift the figure roll; uniform pool over the concrete members (no weight list in v1), granularity shares randomRerollChance, leaked Random degrades to Eighth. The DBG-1 readback is NOT extended (R4): resolvedFigures reports null for an empty figure history, so a rate-only random render still reads as 'fixed figures'."
      - "VL-DET-1: BasicVoiceLeadingVoicer.TargetOctave chooses the first chord's starting register; under a random VoiceLeadingConfig.StartRegisterMode it draws from the part's deterministic ctx.rng (threaded via the optional trailing System.Random rng on IChordVoicer.VoiceChord), NOT global UnityEngine.Random — keeping those modes reproducible and inside the SEED-1 no-self-generated-entropy contract. Non-random start modes never consume rng and stay bit-identical; a null rng (only direct test/tooling calls) retains the legacy global-RNG path. At most one draw per track (TargetOctave returns early for chords after the first). The inversion-pin path stays RNG-free."
      - "CA-T2 Tier-2 (§8.6): IChordReshaper/ChordReshaper reshape the voiced list between VoiceChord and Emit at both sites (deterministic, RNG-free; single unconditional Emit preserved). PowerChord=7 (drop the third -> root+fifth+octave anchored at/below the bass; Block rhythm) and Chugging=8 (same reshape, re-struck at arpeggioRate via the articulator's pitch-preserving ChordPulsePlan; D-T2-RHYTHM=A overloads arpeggioRate, no new field) are append-only after Random and never renumbered; Tier-1/Block/Random are identity (byte-identical). The selected expression passes straight to Emit: the articulator degrades leaked PowerChord/Random to Block and renders Chugging as the chord pulse (never emits a Tier-2 pitch). lastVoicing/first-chord stash keep the full harmonic voicing. Tier-2 is excluded from the §8.5 Random pool and is not weight-admissible (BuildWeightTable ignores value >= ConcretePoolSize; D-T2-POOL=A'). The reshape runs after the §7 inversion pin (§7.5, D-T2-PIN=A): where it removes the pinned voice the pin is a no-op, else the reshape inherits the pinned bass. D-T2-SEAM=B, D-T2-SCOPE=A."
      - "CA-T2-BOSSA register-selective Tier-2 (§8.6): Bossa=9 (append-only after Chugging=8; 0..8 serialized, never renumbered) is a SELECTION figure, not a reshaping one — the reshaper is identity for it and was not modified. D-BOSSA-HOME=A: it lives in the articulator via an extended Hit.NoteIndex vocabulary, NOT a reshaper-owned emit path (which would make the pure list transform an emitter and break the single unconditional Emit). D-BOSSA-SEL=A: the vocabulary is closed — -1 = full chord (voicer order), -2 = upper voices (strictly above the lowest pitch, so a doubled bass pitch never re-strikes offbeat), >= 0 = index into the direction-sorted voicing; the Hit struct shape is unchanged and Emit matches the sentinels EXACTLY (a blanket NoteIndex < 0 test would silently render a subset as a full chord; undefined negatives degrade to the full chord, never silent). Plan: lowest note at the event onset AND every interior bar downbeat, legato to the next low hit / event end (OD-BOSSA-3=A); upper voices on Offbeat's grid at <=0.5 beat; arpeggioRate IGNORED (D-BOSSA-RHYTHM=A, fixed v1 template). D-BOSSA-BASSNOTE=A: the anchor note is simply the lowest note after voicer + §7 pin + CA-T2 reshape — no new precedence rule (§7.5); with a Down pin it is the inverted bass by definition. Degrades to Block for the whole event when the voicing has <=1 note (any bassline card selecting Bossa) or when no offbeat fits (OD-BOSSA-4=A — a bass-only sustain would be a silent register shift, F-WALK-REG). The articulator stays pure and RNG-free; no pitch is created or altered, so the emitted pitch set is a SUBSET of the voicing by construction. Excluded from the §8.5 pool by the existing >= ConcretePoolSize mechanism (no rule edited), test-pinned. FINDING F-BOSSA-FEEL: the v1 template is a register split, not an authentic bossa rhythm (regular low-on-downbeat / uppers-on-offbeat alternation); it ships as-is and only the stylistic label overreaches. OPEN OD-BOSSA-7: whether to rename the member (BassUpperSplit/RegisterSplit, value 9 unchanged) and reserve Bossa. The authentic template is deferred and blocked on a rhythmic SPEC, not on the seam. SUPERSEDED IN PART by CA-T2-BOSSA-V2: the spec arrived, the member was renamed and the authentic figure shipped — see the next invariant."
      - "CA-T2-BOSSA-V2 (§8.3/§8.4/§8.6/§7.5): member 9 is named BassUpperSplit (renamed from Bossa, OD-BOSSA-7=A/-7a=A; VALUE 9 intact — enums serialize by value and the member is never parsed/persisted by name). Bossa = 10 is the AUTHENTIC 1-bar comping template (lab spec basico_solo, D-FEEL-SCOPE=A): LOW 0.0x2.0 medium / UPPERS 0.0x1.0 medium / UPPERS 1.0x1.5 weak / LOW 2.0x2.0 STRONG (surdo — the weight on beat 2, NOT the downbeat) / UPPERS 2.5x1.5 STRONG (syncopation, sustained to the cycle end; NO attack on beat 3). D-FEEL-HOME=A: same seam, no new PlanHits input — bar-length cycle from ABSOLUTE beat position, so a mid-cycle chord change INHERITS the phase and never resets it. D-FEEL-ACCENT=A: accents are TEMPLATE-supplied tiers reusing the SD-5 factor VALUES — a documented per-figure exception to the §8.3 position-derived curve; still pure and RNG-free, jitter composes unchanged. D-FEEL-TIE=A: no hit overshoots the event window; rows at/after the bar length are dropped in meters shorter than 4/4 and durations clip at the cycle end. Degrades to Block: voicing <=1 note, beatsPerBar <= 0, or an event window containing no UPPERS attack (a bass-only fragment would be a silent register shift, F-WALK-REG); an onset landing between template rows gets a LOW fallback hit legato to the first template attack (a chord change is always heard at its onset). Both register-selective figures share the closed §8.4 NoteIndex vocabulary (0 = lowest of the ascending sort, -2 = uppers) and the exact-match Emit translation; the reshaper is identity for both BY EXCLUSION and was not edited. Excluded from the §8.5 pool by value >= ConcretePoolSize (no rule edited), pinned by the tail tripwire (BassUpperSplit=9, Bossa=10, count 11). Deferred, recorded, not scheduled: 2-bar patterns + cycle phase anchor, carries_next_harmony, LOW_ALT, muted ghosts."
      - "chd: is a governed per-chord-EVENT marker (chd:{channel}:{roman}:{symbol}:{deg}:{quality}); the grid site and RenderFromProgression stamp identical (tick,text) sequences (accidental handling aligned, guarded so accidental-free output is bit-identical). MGP-ALWTTT-DBG."
      - "RUNTIME-REQUALITY application sites (§3): exactly TWO data-level transforms run on a progression's runtime clone, in this order — (1) TS/subdivision reprojection, (2) ChordProgressionRequality.ApplyDiatonicRequality against the part's FINAL tonality, which post-B2 is simply the PART's tonality (card authority, never reverted by the asset's tonalities metadata — TONFILTER-1), so the mode the listener actually gets is the one the qualities resolve to. B1 HARMONY-PURE-1 pins the SECOND transform's internal order as a contract: the same entry point applies A core requality (policy-driven, unchanged) → B the color table (policy + useColorTable, REQUALITY-2) → C secondary dominants (per-event opt-in, SECDOM-1, active under ANY policy including AsAuthored), materialized in a SINGLE clone-if-changed — never two clones. Contract order is test-pinned: reprojection FIRST, then A→B→C. Both run inside the same clone/publication step, so the don't-overwrite publication guard still compares against the ORIGINAL asset and every shared-channel consumer (bass, melody) sees the transformed data. The second site is SongOrchestrator.TrySeedDefaultProgression (the backing-less path). D-RQ-SITE: the transform is DATA-level, never composer-local — backing, bass and melody each derive chord pitch classes independently from the shared progression, so a composer-local branch would make them diverge. F-NORM-DROP: the reprojection does NOT clone with Instantiate — it builds a fresh ChordProgressionData and copies fields ONE BY ONE, so ANY NEW ChordProgressionData FIELD MUST BE ADDED TO THAT COPY LIST or it silently reverts to its default on the runtime clone (qualityRenderPolicy was initially omitted, which made requality inert for nearly every asset, since authoring writes sub x1 and the composer normalizes to x4). The copy list now also carries the B1 fields: useColorTable and cadence (asset) and hasAppliedTarget / appliedTarget (event) — verified in smoke with sub x1 → x4. Regression-pinned."
      - "Tonalities as descriptive metadata (B2 TONFILTER-1, §2.2, D-B2-1=C / D-B2-2=B): ChordProgressionData.tonalities records which modes the progression was authored or imported FOR — provenance, not a filter (the runtime importer writes the reference tonality of the Roman parse as its single entry). The runtime does NOT consult it to select, to veto, or to REVERT the part's tonality: the PART's tonality is the card's authority, full stop. THE PRE-B2 BEHAVIOUR IS GONE, not gated: ChordTrackComposer step 2b used to revert part.Tonality when the asset's list excluded it, CONSUMING ONE ctx.rng DRAW to do so — that draw no longer exists, which makes B2 the only batch of the B-series with a real impact radius (renders where the filter used to fire changed). Consequences: mismatched vs empty tonalities now produce BYTE-IDENTICAL stems (the field affects no draw and no note), and RUNTIME-REQUALITY became REACHABLE under a mismatch — pre-B2 the revert resolved qualities against the reverted reference tonality, making the opt-in policies a no-op exactly where they were most needed. The supported adaptation for use outside the reference tonality is qualityRenderPolicy (§3 / authoring §4.1). A foreign-tonality render under AsAuthored is never silent and never spends a draw: the composer flags ResolvedTrackChoice.tonalityMismatch (the testable surface, D-B2-2=B) and, gated by logGenerator, emits a warning. Editor and catalogue-wizard uses of the field are authoring-side navigation only. BOUNDED EXCEPTION — F-B2-LIBRARY (recorded at B4, 2026-07-28): the 'does not select or veto' half of this invariant is scoped to the override, palette and runtime-importer paths. The LEGACY PROCEDURAL TEMPLATE PATH still filters: ChordTrackComposer.PickTemplateForPart, reachable only from BuildProceduralProgression (ChordTrackComposer.cs:985) when ctx.Settings.progressionLibrary != null, discards candidate entries whose allowed list — entry.compatibleTonalities when non-empty, otherwise progression.tonalities — excludes the part's tonality, with a hard continue (ChordTrackComposer.cs:1626-1635). THE CODE IS INTENDED, not drift: B2 left that path out of scope on purpose and recorded it in planning/active/Roadmap_Composition_Expressivity.md §B2 ('the legacy PickTemplateForPart is unchanged'); what was wrong until B4 was the SSoT wording, which generalized without the caveat and left the only record of it in a roadmap — which SSoT_CONTRACTS §6 forbids treating as authority. Retiring the filter changes renders and is an unscheduled RUNTIME candidate. Documented in SSoT_Composer_Backing_Track §2.2 and mirrored in SSoT_Authoring_Chord_Progressions §4.3."
      - "Runtime progression construction (Ask D): ChordProgressionRuntimeImporter builds ChordProgressionData through the SAME grammar/pipeline as the editor (RomanProgressionParser -> RhythmGridQuantizer -> ChordQualityResolver); out-of-alphabet suffixes and quantization failures are hard fails (D-L4.5 allowlist lives runtime-side; editor importer and handler guard delegate); the built instance is NEVER persisted (HideFlags.DontSave) and its name is stamped Runtime: <roman> for by-name readback. Chord palettes enumerate via TrackPatternConfigStoreResources<ChordProgressionPaletteSO>(Chords) over canonical Patterns/Chords/Palettes. MGP-ALWTTT-DBG-4+2."

  - path: Documentation~/runtime/SSoT_Composer_Bass_Track.md
    authority_class: subsystem_ssot
    governs:
      - "Runtime/CoreScripts/Composition/Composers/BassTrackComposer.cs"   # CA-F2 — monophonic consumer of the Tier-1 articulation engine; single unconditional Emit site.
      - "Runtime/CoreScripts/Composition/Data/BasslineCardConfigSO.cs"   # CA-F2 — persistent articulation card (SD-F2-4=A); independent of the backing card (SD-F2-5=A).
      - "Tests/Editor/BassTrackComposer_ArticulationTests.cs"   # CA-F2 — SD-F2-1 gate + deviation pins.
      - "Tests/Editor/BassTrackComposer_PocketTests.cs"   # MGP-ALWTTT-BASS-POCKET-1/2 — planner windowing/classification/gate/dedupe/purity, card surface pins, orchestrator degrade + order-hazard gates, shaping and lane-resolution pins (27 tests; the 16 POCKET-1 tests run UNMODIFIED against the POCKET-2 seam signature).
      - "Tests/Editor/BassTrackComposer_RegisterTests.cs"   # B3 BASS-REG-1 — band, ceiling, pop fold, walk fold, plus two orchestrator-level gates (§2 / §3.6 / §3.7.1). Listed per the bass SSoT's own convention (M-1=A); the document names its test files in §0/§5.
      - "Tests/Editor/BassTrackComposer_WalkImprovTests.cs"   # B3 WALK-2 — BuildWalkLine purity / anchor / vocabulary / approach / variation / ceiling; NearestPitch; card-surface pin; four orchestrator-level gates in the Dbg1Fixtures + FNV idiom (§3.6bis).
    invariants:
      - "Bass articulation (CA-F2): selection is a PERSISTENT BasslineCardConfigSO field pair (chordExpression default Block, arpeggioRate default Eighth; NOT a transient — no snapshot-and-clear); non-bass bundles in the Style slot are ignored (bass never inherits the backing card's expression); Block / absent card is MIDI-byte bit-identical to the legacy MoveToTime+Note pair in every beat-unit==4 meter, with the identical per-event ctx.rng draw count and order (1 root-mode / 2 chord-tone-mode); the single emission site invokes ONE unconditional articulator call; figures apply over the selected note (arpeggios = repeated-note pulse UNLESS the opt-in BASS-WALK-1 chord-tone walk is selected); the bass now builds on the Part beatSpan/beatsPerBar — the beat-unit!=4 legacy Quarter desync is deliberately fixed (deviation on record, test-pinned); engine invariants (RNG-free, never-silent degrade, no window overshoot) apply unchanged. CA-V1 (D-V1-BASS=B) lifts D6: the bass resolves both Random sentinels itself via its own RandomArticulationRoller on trackSeed-derived substreams (role+musicianId are already in trackSeed, so backing and bass never share a sequence) and carries randomRerollChance/randomFigureWeights/velocityJitter; ctx.rng and the per-event draw order remain untouched. Known bias: on a 1-note voicing ArpeggioUp==ArpeggioDown, so the uniform pool double-weights the repeated-note pulse — randomFigureWeights is the intended correction. BASS-WALK-1 (D-WALK-HOME=A): BasslineCardConfigSO.arpeggioToneMode = ChordToneWalk makes the bass hand the SAME single unconditional Emit a 3-note root-anchored triad (BuildWalkVoicing: first Min(3,chordPcs.Length) tones stacked strictly ascending from the ALREADY-DRAWN root octave) so the engine's existing k % noteCount cycling walks root/3rd/5th; NO articulation figure was added and ChordExpressionType is untouched (D-WALK-SURF=A), so nothing enters the §8.5 pool. ZERO new ctx.rng draws (D-WALK-RNG=A): the tones are derived, not drawn, and the branch runs after both §2 draws — the per-event draw contract holds by construction. Default RepeatedNote gates the branch, so pre-batch output is bit-identical STRUCTURALLY. Monophony is guarded by ChordArticulator.ArpeggioFits (D-WALK-FIT=A), the engine's exposed degrade predicate: short events fall back to the 1-note playable, because a degraded Block over a triad would emit a chord. In walk mode the ArpeggioUp==ArpeggioDown pool bias does not arise. F-WALK-REG (first instance) is RESOLVED in B3 BASS-REG-1 — see the register invariant below; BuildWalkVoicing gained a ceiling-aware overload and the 2-argument form survives as the ceiling-free variant (ceiling = int.MaxValue) so the WALK-1 pins keep their meaning verbatim."
      - "SlapPocket coupling (MGP-ALWTTT-BASS-POCKET-1, §3.7): OPT-IN per-event SUBSTITUTION of the bass figure by the Rhythm track's published onsets, selected by BasslineCardConfigSO.pocketMode (append-only bass-only enum PocketCouplingMode { Off = 0, SlapPocket = 1 }, default Off). Source is the GenContext onset channel (D-PKT-SRC=B), fetched ONCE at Compose entry; first non-empty publication in track-list order wins. Kick family (AcousticBassDrum, BassDrum1) → SLAP on the §2 selected note; snare family (AcousticSnare, ElectricSnare) → POP at +12 (D-PKT-POP-PITCH=A; SideStick deliberately excluded in v1). Velocity is the DRUM step's resolved velocity (D-PKT-VEL=A), gate length min(gap, remaining window, 0.5 beat) (D-PKT-GATE=A). Same-beat: pop wins outright over slap (flag AND velocity); within a class, max velocity wins. Classification is on the SEMANTIC lane, PRE kit resolution, so PERC-FALLBACK-1 substitutions can never re-classify a hit. A window WITHOUT triggers renders the resolved figure exactly as decoupled (D-PKT-EXPR=A) — pocket and figures mix within one render; pocketed events bypass both the figure and the walk (pocket hits are 1-note Block segments). DEGRADE IS BYTE-IDENTITY, not approximate: no published source (no Rhythm track / bass composed first / procedural or legacy rhythm path) ⇒ the decoupled figure, AT MOST one warning per Compose, never an error, never silence — which holds STRUCTURALLY because the CA-V1 roller rolls per event whether or not its result is used, so source availability can never shift the roll stream. ZERO new ctx.rng draws (BuildPocketPlan is a pure function of (published onsets, event window) running after both §2 draws — same structural argument as D-WALK-RNG=A); the §2 draw contract is intact. Emission is a SEGMENT list drained by ONE unconditional IChordArticulator.Emit call (SD-F2-1 discipline carried over segments); nothing was added to ChordExpressionType, so nothing entered the §8.5 pool. Order hazard on record (D-PKT-ORDER=A): consumers must place Rhythm before Bassline in Part.Tracks. CONSUMER HASH DUTY: with pocketMode != Off the resolved rhythm pattern is a hash-relevant INPUT of the BASS track and ALWTTT must extend ComputeTrackInputsHashesForPart."
      - "Pocket shaping (MGP-ALWTTT-BASS-POCKET-2, §3.7.1): five card fields, ALL inert at their defaults and all living INSIDE the pocketMode = SlapPocket branch, so the POCKET-1 degrade guarantee is structurally unaffected. D-PKT-VEL2=B: pocketSlapBoost / pocketPopBoost (int, [Range(-64,64)], default 0) are ADDITIVE per-class offsets over the drum step's resolved velocity, clamped 1..127; because published onsets already arrive clamped (the publisher resolves the StepState.velocity == 0 sentinel to the lane default), a boost of 0 is an EXACT identity, not an approximate one. Applied at classification time — observationally equivalent to applying it after the same-beat dedupe, since the offset is uniform within a class and the pop-wins rule never compares velocities — and BEFORE the per-event VelocityJitter refold, which clamps independently. D-PKT-LANES2=C serialization C1: pocketCustomLanes (bool, default false) + pocketSlapLanes / pocketPopLanes (List<GeneralMidiPercussion>, default empty). Toggle OFF ⇒ the built-in v1 families apply exactly, which is also how every pre-POCKET-2 asset deserializes. Toggle ON ⇒ the lists REPLACE the families outright (they do NOT extend them: a lane absent from the list does not fall back to its family); an EMPTY list DISABLES that trigger class (this is how a pop-only or slap-only pocket is expressed); a lane in BOTH lists classifies as POP (the pop membership test runs first, consistent with pop-wins). Matching stays on the SEMANTIC authored lane, immune to PERC-FALLBACK-1 — load-bearing and field-verified against a kit that maps SideStick onto AcousticSnare. Zero new ctx.rng draws; keying untouched. F-WALK-REG SECOND INSTANCE is RESOLVED in B3 BASS-REG-1 (D-REG-2=B): the pop fires at +12 when that fits the register ceiling and FOLDS BACK ONTO THE SELECTED NOTE when it does not. The fold is PITCH ONLY — lane classification (custom lists included), pocketPopBoost, the same-beat pop-wins rule and the D-PKT-GATE=A length all stand, so a folded pop is still a pop dynamically and rhythmically. The planner keeps emitting the pop flag and the fold happens in ResolvePopNote, which is why the whole POCKET-1/2 test surface keeps its meaning verbatim. See the register invariant below."
      - "Register contract (B3 BASS-REG-1, D-REG-1=C, §2): the bass reads BOTH declared instrument bounds. (a) BAND — the octave draw samples octaveMin-1 .. min(octaveMin, octaveMax-1) in DryWetMidi octaves (TWO octaves; the -1 is the authored→DryWetMidi CONVERSION, the same one behind the chord and melody composers' octaveMin-1 .. octaveMax-1), i.e. octaveMin .. octaveMin+1 in authored octaves, capped by the declared ceiling. A degenerate asset (octaveMax <= octaveMin) collapses the band to one octave and NEVER inverts. Pure seam BassTrackComposer.ResolveOctaveBand. (b) CEILING — MIDIInstrumentSO.octaveMax is a HARD ceiling on EVERYTHING the bass emits, not merely on the draw: ceiling = octaveMax * 12 + 11 (B at the top of the declared register, clamped to 127; seam ResolveRegisterCeiling), and every structure built ABOVE the drawn note is guaranteed at or below it — walk voicings fold as a WHOLE by -12 (D-REG-3=B: never a per-note clamp, so shape / intervals / pitch-class order / strict ascent survive the cap and the D-WALK-ANCHOR gesture is preserved), improvised-walk notes fold per note (D-W2-REG — the unit is the note; there is no voicing shape to preserve), and pops fold onto the selected note (D-REG-2=B). The ceiling WINS over the band floor: low is safe on a bass, and the only stop on downward folding is the MIDI floor. All folds are pure and rng-free. DETERMINISM: B3 changed the octave draw's RANGE, not its count or its order, so the §2 draw contract (ONE draw per event in root mode, TWO in chord-tone mode, in that order) is intact — but a given seed now selects a DIFFERENT octave than pre-B3 and every bass render changed. That was the batch's declared, decided outcome, NOT drift. Supersedes both recorded instances of F-WALK-REG. Authored-content note, milder but still live: under a tight octaveMax the walk folds rather than overshooting, audible as a register drop on the affected events — choosing octaveMin/octaveMax on the bass asset is a CONTENT decision, not a package one."
      - "Improvised walk (B3 WALK-2, §3.6bis, D-W2-*): a THIRD opt-in reading of the arpeggio figures, BasslineCardConfigSO.arpeggioToneMode = ImprovisedWalk (D-W2-SURF=A, append-only value 2; default RepeatedNote and the WALK-1 ChordToneWalk are untouched). Unlike WALK-1's fixed root→3rd→5th cycle, identical bar to bar, this plans a line that VARIES between bars. VOCABULARY (D-W2-VOCAB=B), one pitch per arpeggio hit: hit 0 anchors the event root at the §2 drawn octave (the WALK-1 anchor); middle hits are chord tones in the octave NEAREST the previous note, never re-striking it — usually the closest, sometimes the 2nd/3rd closest, with ArpeggioDown biasing equal-distance ties downward; the LAST hit is a chromatic (±1) or whole-step (±2) approach into the NEXT event's root, with the last event wrapping to the first (D-W2-LAST=A, loop-friendly). The next-root lookup mirrors the selection loop's own degree lookup exactly, accidental-blindness included (on record). DIVISION OF LABOR (D-W2-HOME=A): composer-side pitches only (pure static seam BuildWalkLine), while the ENGINE keeps rhythm and dynamics — the composer calls the public pure ChordArticulator.PlanHits(ArpeggioUp/Down, rate, …, noteCount: 1) for the arpeggio grid, accent curve and event jitter (the returned NoteIndex is ignored), and each planned hit re-enters the SAME single unconditional Emit as a 1-note Block SEGMENT with jitter off, so BlockPlan is a velocity passthrough and dynamics are EXACTLY an arpeggio's with no double shaping. Nothing was added to the engine or to ChordExpressionType; Backing §8 holds verbatim and nothing entered the §8.5 pool. The WALK-1 'hand the engine a bigger playable' route was REJECTED here: Emit pitch-sorts arpeggio playables, which destroys a planned contour (WALK-1 survives only because its stack is strictly ascending). VARIATION SOURCE (D-W2-RNG=B) — the load-bearing property: ZERO ctx.rng draws AND no stateful substream. Every choice is a PURE MIX of (walkSeed, eventIndex, hitIndex) in the VelocityJitter idiom (lowbias32 avalanche, integer-only, runtime-stable, exactly pinnable), where walkSeed = SongOrchestrator.ResolveWalkSeed(trackSeed). Because NO STREAM EXISTS, no draw-count discipline is needed: toggling pocket, event lengths or any conditional branch cannot shift a later event's line BY CONSTRUCTION rather than by carefully maintained always-roll discipline. Same seed ⇒ same line (held-loop replay); a later event over the SAME chord walks a different line, since eventIndex is in the mix. GATING: same activation gate as §3.6 (resolved figure ArpeggioUp/ArpeggioDown, ≥ 2 chord pcs, ArpeggioFits true); anything else renders the 1-note playable, byte-identical to RepeatedNote (test-pinned). Pocketed events bypass BOTH walk modes (D-W2-POCKET=A), pinned as byte-identity between them under full pocket coverage. For the next-root lookahead the event enumeration is materialized (prog.events.OrderBy(startStep).ToList()); OrderBy is STABLE, so iteration order — and with it the §2 draw order — is identical to the previous foreach."

