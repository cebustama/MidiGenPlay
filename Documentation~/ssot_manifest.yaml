      - "Runtime/CoreScripts/Composition/Strategies/VoiceLeading.cs"   # CQ-A1-OBJ2 — §7 documents the inversion-pin contract enforced in GeneratePcCandidates; previously ungoverned. PATH INFERRED from CURRENT_STATE ("Strategies/VoiceLeading.cs") — confirm against the package tree.
      - "Runtime/CoreScripts/Composition/Interfaces/IChordVoicer.cs"   # CQ-A1-OBJ2 — VoiceChord carries the optional forcedInversion pin parameter (§7.3). VL-DET-1 — also carries the optional trailing System.Random rng for seeded start-register modes (§7.4). PATH corrected at CA-T2 (was Runtime/CoreScripts/Interfaces/; confirmed under Composition/Interfaces/ against the package tree).
