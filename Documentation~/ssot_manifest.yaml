# PATH CONVENTION
# All paths are relative to the package root (MidiGenPlay/).
# Documentation lives under Documentation~/ (Unity tilde convention).
# Runtime source: Runtime/CoreScripts/
# Editor source:  Editor/
#
# SCHEMA NOTE
# This manifest uses two extensions beyond the base skill schema:
#   reference:  cross-project docs; audited for Step 3 misuse only (no governs)
#   research:   exploratory docs; audited for Step 3 misuse only (no governs)

authority_order:
  - subsystem_ssot
  - contracts
  - coverage_matrix
  - current_state
  - roadmap
  - reference
  - research
  - archive

ssots:

  - path: Documentation~/SSoT_INDEX.md
    authority_class: subsystem_ssot
    governs:
      - "Documentation~/**/*.md"
    invariants:
      - "Authority order: runtime/ > authoring/ > SSoT_CONTRACTS > coverage-matrix > CURRENT_STATE > reference > planning > research > archive."
      - "Cross-project docs under reference/ do not define MidiGenPlay package truth."
      - "Roadmaps, research prompts, and archive docs may not silently become authoritative."

  - path: Documentation~/SSoT_CONTRACTS.md
    authority_class: contracts
    governs:
      - "Runtime/CoreScripts/**/*.cs"
      - "Editor/**/*.cs"
      - "Documentation~/**/*.md"
    invariants:
      - "MidiGenPlay is a Unity package; runtime code must not depend on editor-only APIs."
      - "Part time signature is authoritative for meter normalization and rendering."
      - "No silent promotion: roadmaps, research, cross-project docs, and archive may not become authoritative without an explicit change in coverage-matrix.md and changelog-ssot.md."
      - "A technical change is not complete until primary SSoT, CURRENT_STATE, changelog-ssot, and coverage-matrix are all updated."
      - "Runtime code must clone progression assets before use; project assets must never be mutated in place."
      - "Same inputs + same seed => same outputs. All composers must be deterministic."

  - path: Documentation~/coverage-matrix.md
    authority_class: coverage_matrix
    governs:
      - "Documentation~/**/*.md"
    invariants:
      - "Every concept listed has exactly one primary authority; secondary docs may link but not redefine."

  - path: Documentation~/CURRENT_STATE.md
    authority_class: current_state
    governs: []

  - path: Documentation~/runtime/SSoT_Runtime_Song_Model_and_Config.md
    authority_class: subsystem_ssot
    governs:
      - "Runtime/CoreScripts/Data/SongConfig.cs"
      - "Runtime/CoreScripts/Data/SongConfigSO.cs"
      - "Runtime/CoreScripts/Data/MidiGenPlayConfig.cs"
      - "Runtime/CoreScripts/Managers/SongConfigManager.cs"
    invariants:
      - "SongConfig is the runtime song model authority."
      - "Parts own meter, tonality, root, and track lists."
      - "TrackParameters is the package-owned cross-role input surface."
      - "TrackParameters fields of documentary importance: Pattern, RhythmRecipe, BackingRecipe, Style."

  - path: Documentation~/runtime/SSoT_Runtime_Generation_Orchestration.md
    authority_class: subsystem_ssot
    governs:
      - "Runtime/CoreScripts/Composition/MidiGenerator.cs"
      - "Runtime/CoreScripts/Composition/SongOrchestrator.cs"
      - "Runtime/CoreScripts/Composition/Factories/ComposerFactories.cs"
      - "Runtime/CoreScripts/Composition/Interfaces/ITrackComposer.cs"
    invariants:
      - "MidiGenerator registers composer factories by TrackRole; it is the package-facing entry point, not the per-track implementation surface."
      - "SongOrchestrator walks song structure and executes per-track ITrackComposer instances."
      - "Same inputs + same seed => same outputs. Composers must be deterministic."
      - "Caller-supplied seedOverride (GenerateSong / GenerateSinglePart) is the sole per-render entropy input; baseSeed = seedOverride ?? defaultSeed is resolved once per render and all part/rep/track seeds derive from it (incl. the PaletteSelector RNG stream). No seed supplied => bit-identical to defaultSeed behavior. Seed policy is host-side; the package never self-generates per-render entropy. MGP-ALWTTT-SEED-1."

  - path: Documentation~/runtime/SSoT_Composer_Backing_Track.md
    authority_class: subsystem_ssot
    governs:
      - "Runtime/CoreScripts/Composition/Composers/ChordTrackComposer.cs"
      - "Runtime/CoreScripts/Composition/Data/BackingCardConfigSO.cs"
      - "Runtime/CoreScripts/Composition/Data/ChordProgressionPaletteSO.cs"
      - "Runtime/CoreScripts/Composition/Styles/BackingStyles.cs"
      - "Runtime/CoreScripts/Composition/Data/PaletteSelection.cs"   # CE-F1 shared selector (ProgressionFinder + PaletteSelector); also under SSoT_Composer_Rhythm_Track. Chord selection contract in §2.
      - "Runtime/CoreScripts/Composition/Strategies/VoiceLeading.cs"   # CQ-A1-OBJ2 — §7 documents the inversion-pin contract enforced in GeneratePcCandidates; previously ungoverned. PATH INFERRED from CURRENT_STATE ("Strategies/VoiceLeading.cs") — confirm against the package tree.
      - "Runtime/CoreScripts/Interfaces/IChordVoicer.cs"   # CQ-A1-OBJ2 — VoiceChord carries the optional forcedInversion pin parameter (§7.3).
    invariants:
      - "Part meter is authoritative for backing runtime normalization."
      - "Progression assets must be cloned for runtime use; no in-place mutation of authored assets."
      - "Game-specific card semantics do not redefine backing composer theory."
      - "Chord palette TS-aware selection is delegated to the shared PaletteSelector (Tier A exact-TS / B heuristic / C raw-weights); the prior reflection-based extraction is removed. Duplicate progression references within one palette are independent weighted slots (no de-dup); one rng.NextDouble() per pick preserves determinism."
      - "Per-chord inversion pin (PartConfig.ChordInversionHints, transient, snapshot+cleared by Compose): default-unset is bit-identical; a valid pin yields exactly one candidate rotation in GeneratePcCandidates, outranking useInversions/useDrop2 (D0=A — pinning 0 forces root position and is not unset); out-of-range values are safe no-ops, never clamped (D2b=a); sticky-per-position across pattern repeats within one render (D2a=a); the §6 directional hint wins the render's first chord (D3=A, structural in both render loops); the pin is RNG-free and only active on the voice-leading path."

  - path: Documentation~/runtime/SSoT_Composer_Rhythm_Track.md
    authority_class: subsystem_ssot
    governs:
      - "Runtime/CoreScripts/Composition/Composers/RhythmTrackComposer.cs"
      - "Runtime/CoreScripts/Composition/Styles/RhythmStyleRegistry.cs"
      - "Runtime/CoreScripts/Composition/Styles/RhythmStyles.cs"
      - "Runtime/CoreScripts/Composition/Data/RhythmCardConfigSO.cs"
      - "Runtime/CoreScripts/Composition/Data/DrumPatternPaletteSO.cs"   # L5 (L-PAL); D-PAL.5=B — placed under composer SSoT mirroring ChordProgressionPaletteSO. Runtime consumption wired in PCE (2026-06-04). Palette/pattern .asset instances live under Resources/ScriptableObjects/Drums(/Palettes) but are not listed in governs: — **/*.asset is globally excluded and assets are not text-auditable.
      - "Runtime/CoreScripts/Composition/Data/PaletteSelection.cs"   # CE-F1 shared selector (PatternFinder + PaletteSelector); also under SSoT_Composer_Backing_Track. Drum selection contract in §3D.
      - "Runtime/CoreScripts/Composition/RhythmGridQuantizer.cs"
    invariants:
      - "Active rhythm runtime path is SongConfig / SongOrchestrator / RhythmTrackComposer."
      - "MIDISong / MIDIGeneratorManager branch is legacy/reference; not primary runtime truth."
      - "ComposeFromGrid currently uses SnapshotAsIndices; consuming SnapshotAsStepVelocities is a deferred runtime change."
      - "DrumPatternPaletteSO.PickRandomPattern is deterministic under a seeded System.Random and clones on pick. RhythmTrackComposer consumes the palette (PCE; TS-aware as of CE-F1) via the TS-aware RhythmCardConfigSO.PickPatternOverride(rng, timeSignature, settings, verbose), which delegates to PatternFinder/PaletteSelector. Pick precedence is patternOverride > patternPalette > TrackParameters.Pattern."
      - "preferExactTimeSignatureMatches is LIVE on both the drum and chord palettes: both select through the shared PaletteSelector, which consumes the toggle in one place (CE-F1 — the PCE-era chord-LIVE / drum-INERT asymmetry is resolved)."
      - "Drum-palette Tier-B density is the capped foundational-onset density: kick onsets/bar (GM 35/36; else lowest-note lane) capped at the meter's grouping count, so busy patterns are not penalized — only under-articulation (D-F1.5). One rng.NextDouble() per pick preserves determinism."

  - path: Documentation~/runtime/SSoT_Composer_Melody_Track.md
    authority_class: subsystem_ssot
    governs:
      - "Runtime/CoreScripts/Composition/Composers/MelodyTrackComposer.cs"
      - "Runtime/CoreScripts/Composition/PhrasePlanner.cs"
      - "Runtime/CoreScripts/Composition/Data/MelodicLeadingConfig.cs"
      - "Runtime/CoreScripts/Composition/Data/MelodicStyleSO.cs"
      - "Runtime/CoreScripts/Composition/Data/Phrases/PhraseArchetypeSO.cs"
      - "Runtime/CoreScripts/Composition/Data/Phrases/PhrasePaletteSO.cs"
      - "Runtime/CoreScripts/Composition/Data/Phrases/BurstThenHoldPhraseSO.cs"
      - "Runtime/CoreScripts/Composition/Data/Phrases/EvenFlowPhraseSO.cs"
      - "Runtime/CoreScripts/Composition/Data/Phrases/SustainLeadInPhraseSO.cs"
      - "Runtime/CoreScripts/Composition/Strategies/Melody/AscendingClimbMelodyStrategy.cs"
      - "Runtime/CoreScripts/Composition/Strategies/Melody/ConstrainedMelodyStrategy.cs"
      - "Runtime/CoreScripts/Composition/Strategies/Melody/NearestChordToneMelodyStrategy.cs"
      - "Runtime/CoreScripts/Composition/Strategies/Melody/ScaleFlowMelodyStrategy.cs"
    invariants:
      - "Melody generation splits into phrase planning (PhrasePlanner) and note choice/rendering (MelodyTrackComposer + strategies)."
      - "An authored MelodyPatternData on TrackParameters.Pattern overrides the procedural pipeline via MelodyTrackComposer.ComposeFromPattern (dispatched before progression resolution; the Style/MelodyCardConfigSO procedural overrides are skipped on this path). degree+octaveOffset resolve to an absolute pitch against the active Part tonality/root from the instrument's mid octave (ChooseMelodicRegister convention), clamped to the instrument range; beats are quarter-mapped as in ComposeMelodyFromProgression; the authored loop is tiled to the Part with final-loop truncation; no RNG (deterministic); guide notes are cached via ctx.SetMelodyForPartMusician. The chord progression is not consulted on this path."
      - "Melody card-pattern precedence (D-MEL-INT1): MelodyCardConfigSO.patternOverride (read off TrackParameters.Style) wins over TrackParameters.Pattern, which wins over the procedural pipeline — mirroring RhythmCardConfigSO.patternOverride. The card override feeds the same RNG-free ComposeFromPattern path; the card's leading/palette/style fields stay procedural-only and apply only when no pattern is selected."

  - path: Documentation~/authoring/SSoT_Authoring_Chord_Progressions.md
    authority_class: subsystem_ssot
    governs:
