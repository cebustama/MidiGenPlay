      - "MIDI chord detection is restricted + deterministic: quantize-then-segment on pitch-class sets, >=3 distinct pcs per chord, bass-first exact match, warned reduction, warned skip — never silent"
      - "Chord roots import as degree + degreeAccidental relative to the user key (flat-preferred spelling); inversions/voicings are a documented loss, not a warning"
      - "Quality render policy (RUNTIME-REQUALITY, §4.1, D-RQ-SURF=A): ChordProgressionData.qualityRenderPolicy is an APPEND-ONLY enum on the ASSET — AsAuthored = 0 (default, every pre-existing asset deserializes into it, so the feature is inert and no existing render changes by one byte) / DiatonicToPart = 1 / DiatonicToPartFunctional = 2. Under the opt-in policies, events flagged isDiatonic re-resolve their quality to the diatonic chord of the PART's tonality on the same degree, preserving triad-vs-seventh size. D-RQ-BORROW=A: isDiatonic == false events are NEVER touched — they keep authored quality and degreeAccidental (a ♭VI stays a ♭VI). D-RQ-MAP=A: core alphabet only and size-preserving — the four triad qualities re-map via the diatonic triad of (tonality, degree), the five seventh qualities via the diatonic seventh; Sus2, Sus4, Major6, Minor6, Dominant7sus4 and the three ninths PASS THROUGH unchanged (no clean modal reading; their colour is authored intent), and Major is NEVER promoted to Dominant7 — this is the explicit-suffix-only principle (D-CQA1.1 / D-CQB1.1) read from the render side. D-RQ-FUNC=A / D-RQ-FUNC-SCOPE=A: the Functional variant keeps an authored Major or Dominant7 on the DOMINANT degree and marks it borrowed (isDiatonic = false) on the CLONE, in modes whose diatonic v would lose the leading tone. D-RQ-LOCRIAN=A: documented no-op for both opt-in policies. Purity: ChordProgressionRequality.ApplyDiatonicRequality(prog, tonality) draws ZERO rng, clones only IF something changes (the asset instance is NEVER mutated), returns the SAME REFERENCE on a no-op, and is IDEMPOTENT (re-mapped events are diatonic-stable and the protected dominant re-enters as borrowed and is skipped). Application sites are runtime's, not authoring's — see SSoT_Composer_Backing_Track §3."
      - "Opt-in asset/event field surface (B1 HARMONY-PURE-1, §4.3): every field below is opt-in BY CONSTRUCTION — pre-existing assets stay byte-identical until it is explicitly set. (a) useColorTable : bool, default false (REQUALITY-2, D-CT-GATE=A) — orthogonal to the policy but effective only under a DiatonicToPart* policy; applies the lab's color table over the render clone AFTER the core remap: sixths by mode (Aeolian/Phrygian 6 / m6 → m7; Dorian 6 → m6), sus2 → sus4 in Phrygian, 9 / Maj9 → m9 on minorized degrees (functional exception: a V9 under Functional keeps its quality and is marked borrowed, mirroring D-RQ-FUNC), and the DEGREE SUBSTITUTION ii(dim) → iv (D-CT-DIM=A) on LONG events (>= ColorDiminishedMinBeats, 2 beats) or ACCENTED ones (bar downbeat), size-preserving (triad→triad, seventh→seventh), accidental 0, isDiatonic = true. The substitution applies to the POST-remap state EVEN WHEN THE REMAP CHANGED NOTHING (a sustained authored ii° also substitutes); vii° is out of scope by decision. (b) cadence : CadenceType, default None (CADENCE-META, D-CAD-AUTH=A) — manually authored, append-only enum { None=0, Authentic, Plagal, Half, Modal }; PURE METADATA, composers ignore it entirely and consuming games may gate replace/reskin decisions on it. The editor 'Suggest' button is future QoL, not implemented. (c) hasAppliedTarget : bool + appliedTarget : ScaleDegree (SECDOM-1, D-SD-ENC=A / D-SD-OWN=A) — the secondary-dominant primitive, per event. The event stores a RELATION ('I am the dominant of that degree'), NOT a chord, so it survives transposition and mode changes, which is exactly what a shared progression demands; the FIELD is the opt-in and resolution runs at render time regardless of policy (AsAuthored included) and of tonality (Locrian included). With the flag set the render IGNORES the authored degree/accidental/quality and rewrites them ON THE CLONE: root = perfect fifth above the root of the target degree IN THE CURRENT MODE expressed as (degree, accidental) — always accidental 0 for valid targets, since the degree with a diminished fifth is exactly the diminished-triad degree that validity excludes — quality Dominant7, isDiatonic = false. Validity, and when it fails the authored event renders untouched and SILENTLY: the target's diatonic triad is major or minor; the next event by startStep (with wrap, so turnarounds are legal) is the target with accidental 0 and is not itself a secondary dominant; duration <= the target's. AUTHORING NOTE: the Roman string has NO syntax for this — the fields are set in the asset inspector AFTER the events exist, and a fresh Apply of the string rebuilds the events and LOSES the flags. Grid-inspector UI SHIPPED at CPE-META-1 (2026-07-29, D1=C): the Grid tab's 'Selected Chord Event' panel edits isDiatonic + the SECDOM-1 pair through the existing working-copy + commit flow, with a NON-BLOCKING advisory mirroring the render-time validity rules (Reference Tonality as proxy for the triad test). The Roman string still has no syntax for them."
      - "Roman case precedence (B1 EDITOR-CASE-1, §4.4, D-EC-SEM=B): precedence is explicit suffix > unambiguous case > auto. Under Auto-Diatonic the numeral's case is no longer discarded — the CASE fixes the FAMILY and the auto mode fixes the SIZE ('iv' under Sevenths ⇒ m7, under Triads ⇒ m). The override fires ONLY when the case CONTRADICTS the diatonic family: lowercase on a diatonic minor OR diminished degree (Roman convention writes diminished degrees lowercase too) and uppercase on a major degree both keep the auto quality, so purely diatonic strings resolve exactly as they did before. A contradictory uppercase under Sevenths yields Dominant7 on V and Major7 elsewhere; a contradictory lowercase yields Minor7. Mixed case ('Iv') is discarded with a warning — the only warning case. PARSE-TIME ONLY: saved assets do not change, so this is not an asset migration. The None mode keeps its legacy semantics (case → explicit quality). Alphabet note, unchanged: the bare 7 suffix is case-blind and always Dominant7 ('iv7' is iv with a Dom7; 'ivm7' is the m7 spelling)."
      - "Tonalities as descriptive reference metadata (B2 TONFILTER-1, §4.3): the list of modes the author conceived the progression for. Editor = informational toggles; catalogue wizard = an editor-only navigation filter. NO RUNTIME EFFECT ON THE OVERRIDE, PALETTE AND RUNTIME-IMPORTER PATHS since TONFILTER-1 — there it does not filter selection, does not revert the part's tonality, and consumes no rng. The supported way to sound right outside the reference tonality is qualityRenderPolicy (§4.1). BOUNDED EXCEPTION — F-B2-LIBRARY (recorded at B4, 2026-07-28): the unqualified 'no runtime effect' wording was FALSE. ChordTrackComposer.PickTemplateForPart, on the procedural library branch only (ctx.Settings.progressionLibrary != null), still discards templates whose allowed list — the entry's compatibleTonalities when non-empty, otherwise THIS FIELD — excludes the part's tonality (ChordTrackComposer.cs:1626-1635). On an asset reached through a progression library the field is therefore NOT inert. The code is intended and unchanged; B4 corrected the wording only. Runtime side of the same contract and the same exception: SSoT_Composer_Backing_Track §2.2."
      - "Field-copy canary (B1, §4.5): two pre-existing hazards of the F-NORM-DROP family were fixed editor-side — the grid's selection copy omitted isDiatonic, and the grid's round-trip copy omitted isDiatonic AND degreeAccidental (accidentals were lost when saving from the grid). Both sites now copy ALL 9 ChordEvent fields, secondary dominants included, and the reflection canary ChordEvent_FieldSurface_MatchesEveryFieldByFieldCopySite BREAKS if the field surface changes without every copy site being updated. Treat the canary as the enforcement mechanism for the F-NORM-DROP family on the authoring side, the way the normalization-parity test enforces it on the runtime side."
      - "Asset metadata authoring + optional payload metadata (CPE-META-1 / CPE-META-2, 2026-07-29, §3). EDITOR (D2=C): the window's 'Asset Metadata' section binds DIRECTLY to the bound target asset (Undo.RecordObject + SetDirty per change, the songReferences precedent); the Roman/Grid apply pipelines never read or write qualityRenderPolicy / useColorTable / cadence, so apply-clobber is STRUCTURALLY IMPOSSIBLE and load-on-bind is automatic. useColorTable is UI-gated under AsAuthored; an ML-8b advisory (warn, never block) flags cadence = Authentic over a PURE DiatonicToPart policy (DiatonicToPartFunctional exempt). PAYLOAD (D3=A, D-M2-2): the setup card accepts four OPTIONAL lines — 'Quality render policy:', 'Use color table:', 'Cadence:', 'Allowed tonalities:' (comma-separated Tonality names). ABSENT = SILENT, so every pre-existing payload parses field-identically; PRESENT-BUT-INVALID = the append-only warning kind InvalidMetadataField + the field is IGNORED, and the ImportMode (Full / ProgressionOnly / Failed) is NEVER degraded by metadata — they are not load-bearing mechanical fields. The tonality list is ALL-OR-NOTHING (one bad name discards the list rather than silently narrowing the filter). STAGING (D-M2-1=A): an import never writes the direct-bound trio silently and never parks it in window mirror state (that would recreate the clobber D2=C removed) — it STAGES it in the window (serialized, survives domain reloads), announces it in a banner visible with the foldout collapsed, and the next Apply To Target Asset / Save As New Asset gesture (all four write sites) consumes it and CLEARS the staging; a Discard button drops it; re-applies after consumption never touch metadata. Allowed tonalities is the exception: it is MIRROR state (the toggles) and rides the existing toggles→asset apply route. RUNTIME (D-M2-3=A, one grammar one behavior): ChordProgressionRuntimeImporter.TryParsePayload stamps the same declared metadata on its in-memory instance, and a declared tonality list REPLACES the TONFILTER-1 single-entry provenance default; metadata-free payloads build byte-identical instances to before. LLM (D-M2-4=A): the prompt asks ONLY for the descriptive fields (Cadence, Allowed tonalities); policy and colour table are never requested but are accepted on import when hand-written. Compat constructors on PayloadResult / Result / Outcome are preserved by delegation."

